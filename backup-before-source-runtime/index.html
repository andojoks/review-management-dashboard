<!doctype html>
<html lang="en" data-theme="light" class="js">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Overview — Raveno</title>
    <meta name="description" content="Raveno is the review desk of Handwell: replies, ratings, pros, clients, documents and an inbox." />
    <meta name="theme-color" content="#f2f3f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      /* Before first paint, restore the saved theme and rail so a reload
         never flashes the wrong colours or sidebar width. */
      (function (d) {
        d.classList.add('js');
        var w = innerWidth, rail = false;
        try {
          var t = JSON.parse(localStorage.getItem('raveno:theme') || '"light"');
          d.dataset.theme = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (t === 'dark' || t === 'light' ? t : 'light');
          rail = localStorage.getItem('raveno:rail') === '1';
        } catch (e) {}
        if (w > 760 && (w < 1280 || rail)) d.classList.add('is-rail');
      })(document.documentElement);
    </script>
  </head>
  <body>
    <a class="skip" href="#/overview">Skip to content</a>
    <div id="root"></div>
    <noscript><p style="padding:24px">Raveno needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
