<!DOCTYPE html><html lang="en" data-theme="light" class="js"><head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Overview — Raveno</title>
  <meta name="description" content="Raveno is the review desk of Handwell, a marketplace for local tradespeople: a reply queue with templates, flagged reviews, ratings and response insights, pro onboarding and verification, clients, documents and an inbox — graphite and paper, light and dark, fully animated.">
  <meta name="theme-color" content="#f2f3f5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Raveno — the review desk of Handwell">
  <meta property="og:description" content="Reviews, replies, ratings, pro verification and documents for a trades marketplace, in one monochrome dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="fonts.googleapis.com/css2/family=Urbanist_wght@400..700&amp;display=swap.css" rel="stylesheet">
  <script>
    /* Before first paint: the saved theme and the rail, so a reload never
       flashes the wrong colours or the wrong sidebar. At 1280px and up the
       labelled sidebar is the default and the rail a saved choice; between
       761 and 1279 the rail is automatic. Under ?record the page waits for
       the rig and ignores saved choices. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      var th = location.search.match(/[?&]theme=(dark|light)\b/);
      if (rec && th) d.dataset.theme = th[1];
      var w = innerWidth, rail = false;
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('raveno:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          rail = localStorage.getItem('raveno:rail') === '1';
        }
      } catch (e) {}
      if (w > 760 && (w < 1280 || rail)) d.classList.add('is-rail');
    })(document.documentElement);
  </script>
  <script type="module" src="/src/main.tsx"></script>

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
